[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-skills"
version = "0.1.0"
description = "Six resumable OpenAI-compatible API evaluation skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zhenxiang Wang"}]
dependencies = []

[project.optional-dependencies]
scoring = ["evalscope[ifeval]==1.14.0", "datasets>=3,<5", "huggingface-hub>=0.30,<2"]

[project.scripts]
llm-eval = "llm_eval_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_eval_skills = ["evalplus-lock.json"]
